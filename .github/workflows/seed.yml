name: Seed questions

# À lancer à la main (onglet Actions → Seed questions → Run workflow).
# Ajoute les questions et les mots de départ ; ceux déjà présents sont ignorés.
on:
  workflow_dispatch:
    inputs:
      file:
        description: Fichier de questions (dans apps/worker/seed/)
        default: questions-fr.json
        required: true

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm --filter worker exec wrangler d1 migrations apply kgames --remote
      - name: Seed
        run: pnpm --filter worker run seed:remote -- "seed/${{ inputs.file }}"
